# ShomalDoc — Plesk (nginx) reverse proxy for https://shomaldoc.shomal.ac.ir
# Plesk UI: Websites & Domains > shomaldoc.shomal.ac.ir > Apache & nginx Settings.
# Paste this into "Additional nginx directives". Keep Plesk's own TLS/HTTP2 blocks.
#
# The app listens on 127.0.0.1:3080 only, so this proxy is the single entry point.
client_max_body_size 32m;          # thesis PDFs and receipts; must match the app limit
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_connect_timeout 10s;

# Real client IP reaches the app (audit log records it), and rate limits see users.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "upgrade";

location / {
    proxy_pass http://127.0.0.1:3080;
    proxy_http_version 1.1;
    proxy_buffering off;           # streaming responses for PDF/XLSX downloads
    proxy_request_buffering off;   # large uploads stream straight through
}

# The service worker and the manifest must always be revalidated, otherwise a
# stale shell keeps serving old pages after a release.
location = /sw.js {
    proxy_pass http://127.0.0.1:3080;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
location = /manifest.webmanifest {
    proxy_pass http://127.0.0.1:3080;
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
}

# Never index a university-internal system.
add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

# Limit brute force at the edge as well as in the app (fail2ban watches the log).
location = /login {
    limit_req zone=shomaldoc_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:3080;
}
